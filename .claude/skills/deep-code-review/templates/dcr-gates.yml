name: dcr-gates

# Installed by deep-code-review's `install.sh --with-gates`. Wires the
# INSTALLED skill's own gate scripts into THIS repo's CI, so the lessons the
# skill documents (a pinned test per fix commit, no committed binaries) run
# here as an enforced gate instead of staying prose an agent may or may not
# follow. Edit the trigger branch below if this repo's default branch is not
# `main`. Everything this workflow runs lives in `scripts/dcr-gates.sh`,
# which resolves paths inside the installed skill tree — no gate logic is
# duplicated in this file. Re-run `install.sh --with-gates` after upgrading
# the skill; it will never silently overwrite a file you have since edited
# (see the installer's note on first run).

# `push` + `pull_request` both trigger this workflow. That is a duplicate run
# only if the default branch's required-status-checks are STRICT (a PR branch
# must be up to date before merge) — then the post-merge push re-runs exactly
# what the PR already ran. If this repo enables strict required-status-checks,
# drop the `push:` trigger (or scope it with `paths:`) instead of paying for
# the duplicate run; a non-strict repo can keep both.
on:
  push:
    branches: [main]
  pull_request:

# Cancels a superseded run instead of letting it burn its full runner-minute
# budget after a newer push already replaced it (GitHub Actions concurrency:
# https://docs.github.com/en/actions/using-jobs/using-concurrency).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # least privilege

jobs:
  dcr-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # bound a hung run instead of paying for GitHub's own unset-job default ceiling
    steps:
      # SHA-pinned, not a mutable tag (same pin this skillset's own CI uses).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # fix_class_gate diffs base..head; a depth-1 clone cannot resolve the range

      - name: Run installed deep-code-review gates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/dcr-gates.sh
