<!doctype html>
<!--
  parity_differ.py self-test fixture: an APP where every section is present and
  non-empty (section presence alone would pass) but three buttons (Share, Add
  holding, Load more) and one heading (Recent activity) are absent -> expect
  MISMATCH (exit 1) listing exactly those four MISSING_IN_APP rows.
-->
<html>
<body>
<main>
  <section data-section="overview" data-state="ready">
    <h1>Acme Capital portfolio</h1>
    <img src="logo.svg" alt="Acme Capital logo">
    <p data-item>Welcome back, Jane Smith</p>
    <p>Total balance <span data-value>$4,200</span></p>
    <button type="button">Export CSV</button>
    <a href="/holdings">View all holdings</a>
  </section>
  <section data-section="holdings">
    <h2>Holdings</h2>
    <label for="q">Search holdings</label>
    <input id="q" type="search">
    <label><input type="checkbox"> Show closed positions</label>
    <table>
      <tr><th>Fund</th><th>Value</th></tr>
      <tr data-item><td>Growth Fund</td><td data-value>$1,000</td></tr>
      <tr data-item><td>Income Fund</td><td data-value>$2,000</td></tr>
    </table>
  </section>
  <section data-section="activity">
    <div role="tablist">
      <button role="tab">All</button>
      <button role="tab">Deposits</button>
    </div>
    <ul>
      <li data-item>Deposit received</li>
      <li data-item>Report generated</li>
      <li data-item>Profile updated</li>
    </ul>
  </section>
</main>
</body>
</html>
